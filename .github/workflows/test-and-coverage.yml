name: Tests and Coverage

on:
  push:
    branches: [main, develop, "**-review"]
  pull_request:
    branches:
      - main
      - develop
      - "**-review"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.installer }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        installer: [uv]
        include:
          - python-version: "3.12"
            installer: pip
          - python-version: "3.14"
            installer: pip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        if: matrix.installer == 'uv'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.23
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}

      - name: Install locked dependencies
        if: matrix.installer == 'uv'
        run: uv sync --locked --no-dev --extra test --extra e2e --python '${{ matrix.python-version }}'

      - name: Install with pip
        if: matrix.installer == 'pip'
        run: python -m pip install -e '.[e2e,test]'

      - name: Run uv tests with coverage
        if: matrix.installer == 'uv'
        run: uv run --locked --no-sync python -m pytest tests/ -q --junitxml=junit.xml

      - name: Run pip tests with coverage
        if: matrix.installer == 'pip'
        run: python -m pytest tests/ -q --junitxml=junit.xml

      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.12' && matrix.installer == 'uv'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jeremiah-k/matrix-biblebot
          flags: unittests
          name: python-${{ matrix.python-version }}-${{ matrix.installer }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.12' && matrix.installer == 'uv' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

  package:
    name: Build distributions and smoke test pipx
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.23
          enable-cache: true
      - name: Install development tools
        run: uv sync --locked
      - name: Check Python style
        run: uv run --locked --no-sync ruff check --config .trunk/configs/ruff.toml src
      - name: Build and check distributions
        run: |
          uv build
          uv run --locked --no-sync twine check dist/*
      - name: Install wheel with pipx
        env:
          PIPX_HOME: ${{ runner.temp }}/biblebot-pipx
          PIPX_BIN_DIR: ${{ runner.temp }}/biblebot-pipx-bin
        run: |
          python -m pip install pipx
          python - <<'PYCODE'
          import pathlib
          import subprocess
          import sys
          wheel = next(pathlib.Path("dist").glob("*.whl")).resolve()
          subprocess.run([sys.executable, "-m", "pipx", "install", "--python", sys.executable, str(wheel)], check=True)
          PYCODE
      - name: Smoke test installed entry point and assets
        env:
          BIBLEBOT_HOME: ${{ runner.temp }}/biblebot-package-smoke
          PIPX_BIN_DIR: ${{ runner.temp }}/biblebot-pipx-bin
        run: |
          cd "$RUNNER_TEMP"
          "$PIPX_BIN_DIR/biblebot" --version
          "$PIPX_BIN_DIR/biblebot" config generate
          "$PIPX_BIN_DIR/biblebot" config check
